plugins:
  # 工具域：一行启用整个域
  - id: tools
    name: dev.duo.harness.tools.ToolsPlugin

  # prompt 注册表：systemPrompt 为最前用户指令片段（M7 起经插件发布为 "prompts" 服务）
  - id: prompts
    name: dev.duo.harness.agent.PromptPlugin
    config:
      systemPrompt: "你是在 duo-harness 中运行的助手，回答使用中文并保持简洁。"

  # AGENTS.md 注入：~/.duo/AGENTS.md + 项目根（.git 定根），64KB 预算截断；
  # 注册为 agents-md 片段——行序即组装序（用户指令 → 项目约定 → 技能清单）
  - id: agents-md
    name: dev.duo.harness.agent.AgentsMdPlugin
    config: {}

  # 技能系统：四根发现（.duo/skills → .agents/skills → ~/.duo/skills → ~/.agents/skills）
  # + 清单片段进 prompt 注册表 + skill 工具挂载；disabled 可点名关闭技能
  - id: skills
    name: dev.duo.harness.agent.SkillsPlugin
    config:
      disabled: []

  # 交互服务：回答者注册表（console answerer 由 AgentReplMain 在装配层注册）
  - id: answers
    name: dev.duo.harness.tools.InteractionPlugin

  # 交互审批：写操作被声明"需审批"后由终端 y/n 逐次作答（fail-closed，无永久放行）
  # ——与 ApprovalPlugin（always-deny / auto-approve）二选一挂载
  - id: approval
    name: dev.duo.harness.tools.InteractiveApprovalPlugin

  # 写保护治理插件：对 write_file 声明 ask + guard 拦截涉密文件读取
  - id: write-protector
    name: dev.duo.harness.example.mcpfs.WriteProtectorPlugin

  # 重复调用提醒：同一工具相同参数连续重复达阈值（3/5/8）时在结果尾部附加提醒
  # （内核约定：声明 config 类型即须提供 config 块——块内字段可省，省略即默认阈值）
  - id: repeat-reminder
    name: dev.duo.harness.example.mcpfs.RepeatReminderPlugin
    config: {}

  # 会话独占：Web 面与 CLI 各自尝试续接最新会话，先到者持锁——后到者收到明确占用提示
  # （CLI 改开新会话继续；Web 面启动失败点名被占会话）。同一会话同一时刻只允许一个属主
  - id: web
    name: dev.duo.harness.web.WebPlugin
    config:
      port: 18080   # 避开本机常用端口（8080/8081 被 duoduo 占用）

  # ask_user / exit_plan_mode 交互工具由 WebPlugin 装配链自行注册（纯 Web 部署 HITL 完整）；
  # CLI 侧（AgentRepl）的等价注册在装配层完成
  # MCP 连接行由 AgentReplMain 在运行时以等价配置编程挂载
  # （MiniFileSystemServer 指向临时目录）——等价形态见 demo-m2.yml 注释
