# Java CI 门禁：push（main 与 0.* 版本分支）及全部 PR 时自动执行全量构建与测试。
# 用 ./mvnw 而非预装 mvn——wrapper 本身也在门禁覆盖之内。
# 失败时把报错摘要写进步骤摘要（公开可读，无需仓库日志权限）并上传 surefire 报告。
name: ci

on:
  push:
    branches: [main, '0.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建与全量测试
        run: set -o pipefail && ./mvnw -B -ntp verify 2>&1 | tee /tmp/build.log
      - name: 失败诊断摘要
        if: failure()
        run: |
          {
            echo "## CI 失败诊断"
            echo "### [ERROR] 行（前 40 条）"
            grep -E "^\[ERROR\]" /tmp/build.log | head -40
            echo "### 失败测试（surefire）"
            grep -E 'failures="[1-9]|errors="[1-9]' */target/surefire-reports/*.xml | head -20
            echo "### 构建输出尾部 80 行"
            tail -n 80 /tmp/build.log
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 上传测试报告工件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/**'
          if-no-files-found: ignore
