# Java CI 门禁：push（main 与 0.* 版本分支）及全部 PR 时自动执行全量构建与测试。
# 用 ./mvnw 而非预装 mvn——wrapper 本身也在门禁覆盖之内。
# 失败时把报错摘要写进步骤摘要（公开可读，无需仓库日志权限）并上传 surefire 报告。
name: ci

on:
  push:
    branches: [main, '0.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建与全量测试
        run: set -o pipefail && ./mvnw -B -ntp verify 2>&1 | tee /tmp/build.log
      # 诊断分三个 step：GitHub 注释每 step 上限 10 条，拆开各自有独立额度
      - name: 失败诊断（模块与用例）
        if: failure()
        run: |
          emit() { printf '::error title=%s::%s\n' "$1" "$(printf %s "${2:0:280}" | tr '%' '_')"; }
          grep -E "^\[INFO\] duo-harness.*(SUCCESS|FAILURE)" /tmp/build.log | head -11 | while IFS= read -r l; do emit "模块状态" "$l"; done
          grep -hE "<<< (FAILURE|ERROR)!" */target/surefire-reports/*.txt 2>/dev/null | head -8 | while IFS= read -r l; do emit "失败用例" "$l"; done
      - name: 失败诊断（用例详情）
        if: failure()
        run: |
          DETAIL=$(grep -hE -B1 -A8 "<<< (FAILURE|ERROR)!" */target/surefire-reports/*.txt 2>/dev/null | head -50 | tr '%' '_' | sed ':a;N;$!ba;s/\n/%0A/g')
          [ -n "$DETAIL" ] && printf '::error title=用例详情::%s\n' "${DETAIL:0:3500}"
          true
      - name: 失败诊断（构建尾部）
        if: failure()
        run: |
          TAIL=$(tail -n 60 /tmp/build.log | tr '%' '_' | sed ':a;N;$!ba;s/\n/%0A/g')
          printf '::error title=构建尾部::%s\n' "${TAIL:0:3500}"
      - name: 上传测试报告工件
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '*/target/surefire-reports/**'
          if-no-files-found: ignore
