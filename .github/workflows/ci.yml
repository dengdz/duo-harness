# Java CI 门禁：push（main 与 0.* 版本分支）及全部 PR 时自动执行全量构建与测试。
# 用 ./mvnw 而非预装 mvn——wrapper 本身也在门禁覆盖之内。
name: ci

on:
  push:
    branches: [main, '0.*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 构建与全量测试
        run: ./mvnw -B -ntp verify
