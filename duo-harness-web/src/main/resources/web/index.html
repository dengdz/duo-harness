<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duo-harness · Web 双面</title>
<!--
  Web 双面单页骨架：样式层在 /web/theme.css，脚本层在 /web/app.js（分文件维护，
  经 /web/ 白名单资源服务）。结构：三区骨架（会话 / 对话 / 状态）。
  交互卡片统一走 #messages 事件委托（data-action），不在卡片上逐个挂监听。
-->
<link rel="stylesheet" href="/web/theme.css">
</head>
<body>
  <!-- ===== §骨架层 · 会话侧栏（列出 / 切换 / 新建 / 内容检索） ===== -->
  <section id="sessions">
    <h2>会话 <span class="hint">agent-sessions</span></h2>
    <button id="newSession">＋ 新话题</button>
    <input id="sessionSearch" placeholder="搜索会话内容…（回车检索）">
    <div id="searchResults" hidden></div>
    <div id="sessionList" style="overflow-y:auto;flex:1;padding-top:4px"></div>
  </section>

  <!-- ===== §骨架层 · 对话面 ===== -->
  <section id="chat">
    <h2>对话 <span class="hint" id="chatHint"></span></h2>
    <div id="historyMore" hidden></div>
    <div id="messages"></div>
    <div id="hero">
      <div class="mark">duo-harness</div>
      <div class="title">新会话</div>
      <div class="hint">描述你想要构建的内容，或 /技能名 直调技能</div>
    </div>
    <div id="todoPanel" class="todo-panel" hidden></div>
    <div class="composer">
      <div id="atDropdown" hidden></div>
      <input id="input" placeholder="输入消息，回车发送…（/技能名 直调）">
      <button id="stop" hidden title="协作式中断当前任务（已流出内容保留，再发消息即续接）">停止</button>
      <button id="send">发送</button>
    </div>
  </section>

  <!-- ===== §骨架层 · 状态面 ===== -->
  <section id="status">
    <h2>状态 <span class="hint">实时刷新</span></h2>
    <div id="statusBody">
      <div class="status-group">上下文</div>
      <div id="contextLine" class="context-line">—</div>
      <div class="status-group">后台任务</div>
      <div id="bgTasks">—</div>
      <div class="status-group">连接器（MCP 等）</div>
      <div id="connectorStatus">—</div>
      <div class="status-group">插件（六态）</div>
      <table id="plugins"><thead><tr><th>插件</th><th>状态</th></tr></thead><tbody></tbody></table>
      <div class="status-group">工具（本机 + MCP 远端）</div>
      <table id="tools"><thead><tr><th>工具</th><th>说明</th></tr></thead><tbody></tbody></table>
    </div>
  </section>

<div id="toasts"></div>

<!-- ===== §骨架层 · 子任务抽屉（M15 工单 05）：从右侧滑出，内容复用主对话渲染器 ===== -->
<aside id="subagentDrawer" hidden>
  <div class="drawer-bar">
    <b id="subagentTitle">子任务全程</b>
    <button id="subagentClose">关闭</button>
  </div>
  <div id="subagentBody"></div>
</aside>

<script src="/web/marked.min.js"></script>
<script src="/web/purify.min.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
