<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duo-harness · Web 双面</title>
<!--
  Web 双面单页骨架：样式层在 /web/theme.css，脚本层在 /web/app.js（分文件维护，
  经 /web/ 白名单资源服务）。结构：三区骨架（会话 / 对话 / 状态）。
  交互卡片统一走 #messages 事件委托（data-action），不在卡片上逐个挂监听。
-->
<link rel="stylesheet" href="/web/theme.css">
</head>
<body>
  <!-- ===== §骨架层 · 会话侧栏（列出 / 切换 / 新建） ===== -->
  <section id="sessions">
    <h2>会话 <span class="hint">agent-sessions</span></h2>
    <button id="newSession">＋ 新话题</button>
    <div id="sessionList" style="overflow-y:auto;flex:1;padding-top:4px"></div>
  </section>

  <!-- ===== §骨架层 · 对话面 ===== -->
  <section id="chat">
    <h2>对话 <span class="hint" id="chatHint"></span></h2>
    <div id="messages"></div>
    <div id="hero">
      <div class="mark">duo-harness</div>
      <div class="title">新会话</div>
      <div class="hint">描述你想要构建的内容，或 /技能名 直调技能</div>
    </div>
    <div class="composer">
      <input id="input" placeholder="输入消息，回车发送…（/技能名 直调）">
      <button id="send">发送</button>
    </div>
  </section>

  <!-- ===== §骨架层 · 状态面 ===== -->
  <section id="status">
    <h2>状态 <span class="hint">实时刷新</span></h2>
    <div id="statusBody">
      <div class="status-group">上下文</div>
      <div id="contextLine" class="context-line">—</div>
      <div class="status-group">插件（六态）</div>
      <table id="plugins"><thead><tr><th>插件</th><th>状态</th></tr></thead><tbody></tbody></table>
      <div class="status-group">工具（含 MCP 远端）</div>
      <table id="tools"><thead><tr><th>工具</th><th>说明</th></tr></thead><tbody></tbody></table>
    </div>
  </section>

<div id="toasts"></div>
<script src="/web/marked.min.js"></script>
<script src="/web/purify.min.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
